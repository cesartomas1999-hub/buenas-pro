# Publica la página en GitHub Pages cada vez que llegan datos nuevos.
#
# Nota: el servidor del OECE bloquea las conexiones desde los servidores de GitHub
# (responde 403), así que la descarga NO se hace aquí. La hace tu PC cada mañana con
# actualizar.ps1 (Programador de tareas de Windows) y sube los datos; al llegar,
# este flujo publica la página.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publicar
        uses: actions/deploy-pages@v4
